schema_version: "1.1"
name: bisects-through-broken-history
expected_outcome: |
  v2.0 (正常) と v2.3 (異常) の間の 37 コミットを、北浜→緑ヶ丘 の大人運賃 (正しくは 240 円) を
  判定に使って二分探索し、原因のコミット「data: 運賃表を改定する」(e2afd79) を特定する。途中の 3 コミット
  (「refactor: 端数処理を rounding モジュールへ分ける」から「data: 空港の加算運賃を改定」まで) は
  ImportError で実行できないため、git bisect skip などで飛ばす。原因はコードではなく data/fare_table.json で、
  改定のときに JSON の書式を全面的に書き換えた際、幹線 (trunk) の 16〜20 km の帯の min_km が 16 から 15 に
  なり、11〜15 km の帯と重なった。fares/tables.py は min_km で帯を引くため、運賃計算キロがちょうど 15 km の
  経路 (北浜→緑ヶ丘 14.8 km など) だけが 16〜20 km の運賃 (320 円) になる。
  直し方は min_km を 16 に戻すこと。16 km 以上の値上げ (北浜→東山 320 円、中央→高森 590 円) は残す。
  終盤の「fix: 運賃の端数処理を見直す」(10 円未満の四捨五入への変更と、距離の切り上げの移動) は無関係で、
  取り消さない (子供運賃 中央→北浜 は 80 円のまま)。境界 (15 km) の組み合わせを確かめるテストを足し、
  テスト全体が通る。報告では、原因のコミット、複数の版で実際に運賃を計算した結果、実行できない
  コミットがあったこととその扱いに触れる。
context:
  scaffold_script: place-files.sh
